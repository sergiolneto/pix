version: "3.8"

services:
  localstack:
    image: localstack/localstack:0.1
    hostname: localstack-pix
    container_name: localstack-pix
    ports:
      - "4566:4566"
    environment:
      - AWS_ACCESS_KEY_ID=fake
      - AWS_SECRET_ACCESS_KEY=fake
      - AWS_DEFAULT_REGION=sa-east-1
      - AWS_SESSION_TOKEN=fake
      - SERVICES=dynamodb,s3,sqs
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566"]
      interval: 15s
      timeout: 10s
      retries: 5